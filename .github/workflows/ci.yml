name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_27.2.app

jobs:
  build-and-test:
    name: Lint, build, test, package
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode27.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode27.2-

      - name: Install lint tools
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          xcrun --find swift-format >/dev/null 2>&1 || brew install swift-format

      - name: Lint Swift
        run: |
          if xcrun --find swift-format >/dev/null 2>&1; then
            xcrun swift-format lint --strict --parallel -r Sources Tests
          else
            swift-format lint --strict --parallel -r Sources Tests
          fi

      - name: Lint shell scripts
        run: |
          shopt -s nullglob
          scripts=(scripts/*.sh scripts/lib/*.sh)
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck "${scripts[@]}"

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Release dry run
        run: scripts/test-release.sh
