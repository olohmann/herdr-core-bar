name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z). Run from the tag v<version>, or from main to tag HEAD."
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  XCODE_APP: /Applications/Xcode_27.2.app

jobs:
  release:
    name: Build, notarize, publish
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a semantic version: $version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Import signing certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077 && printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode >"$RUNNER_TEMP/developer-id.p12")
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # word splitting of the existing search list is intended
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode >"$key")
          echo "ASC_KEY_PATH=$key" >>"$GITHUB_ENV"

      - name: Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$DRAFT" == true ]]; then args+=(--draft); fi
          scripts/release.sh "$VERSION" ${args[@]+"${args[@]}"}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: herdr-core-bar-${{ steps.version.outputs.version }}
          path: |
            dist/*/HerdrCoreBar-*.zip
            dist/*/HerdrCoreBar-*.dmg
            dist/*/appcast.xml
            dist/*/herdr-core-bar.rb
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
